server {
    listen 127.0.0.1:8443 ssl;
    server_name dzp1125.me;
    ssl_certificate /etc/letsencrypt/live/dzp1125.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dzp1125.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DashboardTLS:1m;
    server_tokens off;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 40s;
    }
}
