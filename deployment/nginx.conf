limit_req_zone $binary_remote_addr zone=dashboard_quotes:1m rate=2r/s;
server {
    listen 127.0.0.1:18080;
    server_name _;
    root /opt/stock-dashboard/current/frontend;
    index index.html;
    server_tokens off;
    auth_basic "Private stock dashboard";
    auth_basic_user_file /etc/nginx/stock-dashboard.htpasswd;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

    location = /accounts/paper {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location ~ ^/stock/[^/]+/search$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=dashboard_quotes burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_read_timeout 35s;
    }
    location ~ ^/(accounts|stock|docs|redoc|openapi.json)(/|$) { return 404; }
    location ~ /\. { deny all; }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/ =404;
    }
}
