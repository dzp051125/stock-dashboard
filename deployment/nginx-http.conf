server {
    listen 80;
    listen [::]:80;
    server_name dzp1125.me;
    root /var/www/dzp-start/dashboard-test;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; try_files $uri =404; }
    location / { return 301 https://dzp1125.me$request_uri; }
    location ~ /\. { deny all; }
}
